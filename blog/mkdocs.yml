site_name: Python Bootcamp by Luis Correa
site_description: Notas y guías técnicas del bootcamp de Python
site_author: Luis Correa
site_url: https://roamingpa.github.io/bootcamp-python/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: es
  - blog:
      blog_toc: true
      post_date_format: long
      post_url_format: "{date}/{slug}"
  - glightbox:           # zoom en imágenes al hacer click
      touchNavigation: true
      loop: false
  - print-site:          # página /print_page con todo el sitio unificado para imprimir
      add_to_navigation: true
      print_page_title: "Imprimir / Exportar"
      add_full_urls: false
      enumerate_headings: false
      add_table_of_contents: true

nav:
  - Inicio: index.md
  - Python Principiante:
    - Fundamentos del lenguaje: fundamentos.md
    - Manejo de Archivos: archivos.md
    - Excepciones: excepciones.md
  - Python Avanzado:
    - Funciones: funciones.md
    - POO — Clases y Objetos: poo.md
    - POO — Características: poo_caracteristicas.md
  - Tecnologías Web: web.md
  - Herramientas:
    - Git y GitHub: git.md
  - Blog: blog/index.md
